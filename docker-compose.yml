services:
  postgres:
    image: postgres:15-alpine
    container_name: ddlc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red-bd

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ddlc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - red-bd
    depends_on:
      - postgres

  express:
    build: ./
    container_name: ddlc_express
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "3001:3001"
    networks:
      - red-bd
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  red-bd:
    driver: bridge